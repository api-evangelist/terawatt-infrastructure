aid: terawatt-infrastructure
name: Terawatt Infrastructure
description: 'Terawatt Infrastructure is a US infrastructure company that acquires, develops, owns,
  and operates purpose-built electric-vehicle charging centers for commercial fleets — medium- and
  heavy-duty trucking, drayage, autonomous vehicle and rideshare operators. The company sells
  charging-as-a-service rather than software: it holds real estate and grid interconnection, builds
  high-power charging sites (including the I-10 electrified corridor and sites near the Ports of Los
  Angeles and Long Beach), and runs them with its own proprietary Charge Management Software,
  operations and maintenance program, and a customer reservations portal. Terawatt states publicly
  that it has implemented the Open Charge Point Interface (OCPI) with custom extensions so fleet
  customers get visibility into its charging facilities, but it publishes no public developer portal,
  API reference, or machine-readable contract for that surface.'
